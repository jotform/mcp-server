<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Jotform AI integrations</title>
  <desc id="description">Bring Jotform into the conversation. AI tools connect through Jotform MCP to Forms, Sign, and Apps.</desc>
  <defs>
